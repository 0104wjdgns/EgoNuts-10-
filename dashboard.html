<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>대시보드 — 이기심 · 에고너츠</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
  <style>
    .dash { max-width: 900px; margin: 0 auto; padding: 48px clamp(20px,5vw,40px) 120px; }
    .dash h1 { font-size: 1.6rem; font-weight: 600; margin: 0 0 6px; }
    .dash .meta { color: var(--ink-soft); font-weight: 300; font-size: 0.95rem; margin: 0 0 34px; }
    .toolbar { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 30px; }
    .toolbar button { border: 1px solid var(--line); border-radius: 3px; padding: 8px 16px; font-size: 0.95rem; }
    .toolbar button:hover { border-color: var(--accent); }
    .qgroup { margin: 0 0 46px; }
    .qgroup > h2 { font-size: 1.15rem; font-weight: 500; color: var(--accent); margin: 0 0 4px; }
    .qgroup > .qtext { font-size: 1.05rem; font-weight: 400; margin: 0 0 20px; line-height: 1.5; }
    .ans { padding: 16px 0; border-top: 1px solid var(--line); }
    .ans .who { font-size: 0.85rem; color: var(--ink-faint); letter-spacing: 0.06em; margin: 0 0 8px; }
    .ans .txt { font-weight: 300; line-height: 1.75; white-space: pre-wrap; }
    .ans .txt.empty { color: var(--ink-faint); font-style: italic; }
    .gate { max-width: 360px; margin: 18vh auto 0; text-align: center; }
    .gate p { color: var(--ink-soft); font-weight: 300; margin: 0 0 26px; }
  </style>
</head>
<body>
  <main id="dash" class="dash"></main>
  <script src="config.js"></script>
  <script src="assets/dashboard.js"></script>
</body>
</html>
